<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Carve Time</title>
<meta name="description" content="Plan your time on a grid, then work through it with a calm visual timer.">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface2:#ECEBE6; --text:#18181B; --muted:#6B6B73; --faint:#A3A3AB;
  --line:rgba(24,24,27,.10); --grid:rgba(24,24,27,.15); --cell:rgba(24,24,27,.025);
  --accent:#18181B; --on-accent:#FFFFFF; --tint:.18; --scrim:rgba(20,20,22,.32);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111113; --surface:#1B1B1F; --surface2:#28282D; --text:#F4F4F5; --muted:#A1A1AA; --faint:#62626B;
  --line:rgba(255,255,255,.09); --grid:rgba(255,255,255,.16); --cell:rgba(255,255,255,.025);
  --accent:#F4F4F5; --on-accent:#111113; --tint:.24; --scrim:rgba(0,0,0,.55);
  --shadow:0 8px 24px rgba(0,0,0,.45);
}}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:default}
svg{display:block}
.app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

/* bars & buttons */
.bar{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:6px;flex:none}
.bar .title{font-weight:700;font-size:17px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
.actions{display:flex;gap:2px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon:active{background:var(--surface2)}
.icon svg{width:22px;height:22px}
.icon.sm{width:36px;height:36px}.icon.sm svg{width:18px;height:18px}
.primary{height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;width:100%;flex:none;transition:transform .1s,opacity .2s}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.3}
.secondary{height:48px;border-radius:14px;background:var(--surface2);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.secondary:active{filter:brightness(.96)}
.secondary svg{width:18px;height:18px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.muted{color:var(--muted)}

/* home */
.home-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.kicker{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.q{margin:0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.02em;max-width:310px}
.stepper{display:flex;align-items:center;gap:18px}
.round{width:54px;height:54px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center}
.round svg{width:22px;height:22px}
.round:active{transform:scale(.95)}
.hval{font-size:46px;font-weight:800;letter-spacing:-.035em;min-width:160px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.qchip{height:36px;padding:0 14px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:14px}
.qchip.on{background:var(--accent);color:var(--on-accent)}
.hprev{width:100%;flex:1;min-height:60px;max-height:260px;display:grid;place-items:center}

/* grid */
.gridwrap{flex:1;min-height:0;display:grid;place-items:center;touch-action:none}
.grid{overflow:visible}
.grid .cell{fill:var(--cell);stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.grid .dim{opacity:.42}
.tint{fill-opacity:var(--tint)}
.lbl{font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl.sub{font-weight:600;opacity:.85}

/* planner */
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:none}
.pill{height:28px;padding:0 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill b{color:var(--text);font-weight:700}
button.pill svg{width:14px;height:14px}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px;min-height:2.8em;flex:none;padding:0 8px}
.toolbar{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:none;touch-action:pan-x}
.toolbar::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;border-radius:999px;padding:0 14px 0 10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;max-width:220px}
.chip .dot{width:16px;height:16px;border-radius:5px;background:var(--c);flex:none}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--muted);font-weight:600;font-size:13px}
.chip.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.chip.add{background:var(--accent);color:var(--on-accent);border-color:transparent;padding:0 16px 0 12px}
.chip.add:disabled{opacity:.3}
.chip svg{width:18px;height:18px}

/* board */
.leadbox{flex:none}
.lead{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.sublead{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;min-height:1.4em}
.autorow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:16px;background:var(--surface2);flex:none}
.autorow .txt{flex:1;min-width:0;font-weight:700;font-size:15px}
.autorow small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.autorow .switch[aria-checked="false"]{background:color-mix(in srgb,var(--text) 16%,transparent)}
#bWrap{flex:none;height:min(40dvh,88vw);touch-action:manipulation}
.list{list-style:none;margin:0;padding:0 0 4px;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.item:active{filter:brightness(.97)}
.sw{width:30px;height:30px;border-radius:9px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.sw::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--f,1)*100%);background:var(--c)}
.iname{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imeta{color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .iname{color:var(--muted)}
.item.run{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.go svg{width:16px;height:16px}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:600;flex:none;gap:12px}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:13px;padding:8px 0}

/* timer */
#timer{gap:4px}
.clockbox{text-align:center;flex:none}
#clock{font-size:clamp(52px,17vw,72px);font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
#clockDate{color:var(--muted);font-weight:600;font-size:14px;margin-top:6px}
.stage{flex:1;min-height:0;position:relative}
.stage svg{position:absolute;left:8px;top:14px;width:calc(100% - 16px);height:calc(100% - 28px);overflow:visible}
.stage.warn svg{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 16px var(--c))}}
.tinfo{text-align:center;flex:none;display:flex;justify-content:center;align-items:baseline;gap:8px}
#tRemain{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#tState{color:var(--muted);font-weight:600;font-size:14px}
.tends{text-align:center;color:var(--muted);font-weight:600;font-size:14px;min-height:1.4em;flex:none;font-variant-numeric:tabular-nums}
.stage.brk svg{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.warnpill{align-self:center;flex:none;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);font-weight:700;font-size:13px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.controls{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:8px;flex:none}
.ctl{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ctl svg{width:22px;height:22px}
.ctl:disabled{opacity:.3}
.ctl.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.play{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-c);box-shadow:0 6px 20px color-mix(in srgb,var(--c) 35%,transparent)}
.play svg{width:32px;height:32px}
.play:active,.ctl:active{transform:scale(.95)}
.trackpill{align-self:center;flex:none;display:flex;gap:8px;align-items:center;height:38px;padding:0 14px;margin-top:4px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;max-width:100%;overflow:hidden}
.trackpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trackpill svg{width:16px;height:16px;flex:none}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.lab{font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 8px}
.field{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:17px;font-weight:600;padding:0 14px;outline:none}
.field:focus{border-color:var(--text)}
.field.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug{height:34px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:14px;display:flex;align-items:center}
.sugpick{height:100%;display:flex;align-items:center;gap:7px;padding:0 2px 0 8px;font-weight:600}
.sug i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.sugx{width:32px;height:100%;display:grid;place-items:center;color:var(--faint);border-radius:0 999px 999px 0}
.sugx svg{width:12px;height:12px}
.sugx:active{color:var(--text)}
.toast .tact{margin-left:14px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:2px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.swatch{aspect-ratio:1;border-radius:12px;background:var(--c)}
.swatch.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--text)}
.swatch:disabled{opacity:.15}
.donebox{text-align:center;padding:8px 0 4px}
.donebox .sw{width:56px;height:56px;border-radius:16px;margin:0 auto 14px}
.donebox p{margin:8px 0 20px}

/* panels */
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:fade .15s}
.panel .wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1;padding:calc(8px + env(safe-area-inset-top)) 16px 0}
.pbody{flex:1;overflow:auto;scrollbar-width:none;padding:0 0 calc(28px + env(safe-area-inset-bottom))}
.pbody h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;min-height:58px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0;font-weight:600}
.row small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.row .chev{color:var(--faint)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-accent)}
.mini{display:flex;align-items:center;gap:6px;flex:none}
.mini output{min-width:64px;text-align:center;font-weight:700;font-size:14px}
.mini button{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.mini svg{width:16px;height:16px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btnrow{display:flex;gap:10px;padding:12px 14px}.btnrow>*{flex:1}
.ver{text-align:center;color:var(--faint);font-size:12px;margin-top:24px}

/* music sheet */
.tracks{list-style:none;margin:14px 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.trk{display:flex;align-items:center;gap:4px;border-radius:14px;background:var(--bg)}
.trk.on{box-shadow:inset 0 0 0 1.5px var(--text)}
.tsel{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;min-width:0;font-weight:600}
.tsel svg{width:18px;height:18px;color:var(--muted);flex:none}
.tsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol{display:flex;align-items:center;gap:12px;margin:14px 2px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.vol input{flex:1;accent-color:var(--text)}
.applist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.applist .secondary{justify-content:space-between}
.note{font-size:14px;margin:12px 2px}

/* history */
.hsum{display:flex;align-items:baseline;gap:8px;margin:18px 4px 0}
.hsum b{font-size:34px;font-weight:800;letter-spacing:-.03em}
.hrow{padding:12px 16px}
.hrow+.hrow{border-top:1px solid var(--line)}
.hline{display:flex;align-items:center;gap:10px;font-weight:600}
.hline .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hline .v{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.hline i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.hbar{height:8px;margin-top:8px;border-radius:4px;display:flex;gap:2px}
.hbar span{display:block;height:100%;border-radius:4px;background:var(--c);min-width:3px}
.hdet{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}

.toast{position:fixed;left:0;right:0;margin:0 auto;top:calc(12px + env(safe-area-inset-top));background:var(--accent);color:var(--on-accent);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center;animation:up .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<!-- 1. How much time today? -->
<section id="home" class="screen" hidden>
  <header class="bar">
    <div class="brand"><span id="logo"></span>Carve Time</div>
    <div class="actions">
      <button class="icon" data-panel="history" data-ic="chart" data-aria="history"></button>
      <button class="icon" data-panel="settings" data-ic="sliders" data-aria="settings"></button>
    </div>
  </header>
  <div class="home-main">
    <p class="kicker" id="homeDate"></p>
    <h1 class="q" data-i18n="hoursQ"></h1>
    <div class="stepper">
      <button class="round" id="hMinus" data-ic="minus" aria-label="−"></button>
      <output class="hval" id="hVal"></output>
      <button class="round" id="hPlus" data-ic="plus" aria-label="+"></button>
    </div>
    <div class="quick" id="hQuick"></div>
    <div class="hprev" id="hPrevWrap"><svg id="hPrev" class="grid"></svg></div>
  </div>
  <button class="primary" id="hGo"></button>
</section>

<!-- 2. Carve sections -->
<section id="plan" class="screen" hidden>
  <header class="bar">
    <button class="icon" id="pBack" data-ic="back" data-aria="back"></button>
    <div class="title" data-i18n="planTitle"></div>
    <button class="icon" data-panel="settings" data-ic="sliders" data-aria="settings"></button>
  </header>
  <div class="stats" id="pStats"></div>
  <div class="gridwrap" id="pWrap"><svg id="pSvg" class="grid"></svg></div>
  <p class="hint" id="pHint"></p>
  <div class="toolbar" id="pTools"></div>
  <button class="primary" id="pConfirm" data-i18n="confirmPlan"></button>
</section>

<!-- 3. Today's board -->
<section id="board" class="screen" hidden>
  <header class="bar">
    <div class="brand"><span id="logo2"></span><span id="bDate"></span></div>
    <div class="actions">
      <button class="icon" id="bEdit" data-ic="edit" data-aria="editPlan"></button>
      <button class="icon" data-panel="history" data-ic="chart" data-aria="history"></button>
      <button class="icon" data-panel="settings" data-ic="sliders" data-aria="settings"></button>
    </div>
  </header>
  <div class="leadbox"><p class="lead" id="bLead"></p><p class="sublead" id="bSub"></p></div>
  <div class="gridwrap" id="bWrap"><svg id="bSvg" class="grid"></svg></div>
  <div class="autorow"><div class="txt"><span data-i18n="autorun"></span><small data-i18n="autorunShort"></small></div><button class="switch" role="switch" data-key="autorun"></button></div>
  <ul class="list" id="bList"></ul>
  <div class="foot"><span id="bProgress"></span><button class="link" id="bReset" data-i18n="startOver"></button></div>
</section>

<!-- 4. Timer -->
<section id="timer" class="screen" hidden>
  <header class="bar">
    <button class="icon" id="tBack" data-ic="back" data-aria="back"></button>
    <div class="title" id="tName"></div>
    <button class="icon" id="tMusic" data-ic="music" data-aria="music"></button>
  </header>
  <div class="clockbox"><div id="clock"></div><div id="clockDate"></div></div>
  <div class="stage" id="tStage"><svg id="tSvg"></svg></div>
  <div class="warnpill" id="tWarn" hidden></div>
  <div class="tinfo"><span id="tRemain"></span><span id="tState"></span></div>
  <div class="tends" id="tEnds"></div>
  <div class="controls">
    <button class="ctl" id="tMute"></button>
    <button class="play" id="tPlay"></button>

// Called when a section's timer starts: only topics you actually work on are remembered,

/* ---------------- grid drawing (SVG, 100 units per block) ---------------- */
// One block. Sides that touch a block of the same section are drawn flush, so the section reads as one shape.
function cellD(x0, y0, h, rad, n){
  const X1 = x0 + U, Y1 = y0 + U;
  const l = n.L ? x0 : x0 + h, r = n.R ? X1 : X1 - h, t = n.T ? y0 : y0 + h, b = n.B ? Y1 : Y1 - h;
  let d;
  if (!n.L && !n.T) d = `M${l} ${t + rad}A${rad} ${rad} 0 0 1 ${l + rad} ${t}`;
  else if (n.L && n.T && !n.TL) d = `M${x0} ${y0 + h}A${h} ${h} 0 0 0 ${x0 + h} ${y0}`;
  else d = `M${l} ${t}`;
  if (!n.T && !n.R) d += `L${r - rad} ${t}A${rad} ${rad} 0 0 1 ${r} ${t + rad}`;
  else if (n.T && n.R && !n.TR) d += `L${X1 - h} ${y0}A${h} ${h} 0 0 0 ${X1} ${y0 + h}`;
  else d += `L${r} ${t}`;
  if (!n.R && !n.B) d += `L${r} ${b - rad}A${rad} ${rad} 0 0 1 ${r - rad} ${b}`;
  else if (n.R && n.B && !n.BR) d += `L${X1} ${Y1 - h}A${h} ${h} 0 0 0 ${X1 - h} ${Y1}`;
  else d += `L${r} ${b}`;
  if (!n.B && !n.L) d += `L${l + rad} ${b}A${rad} ${rad} 0 0 1 ${l} ${b - rad}`;
  else if (n.B && n.L && !n.BL) d += `L${x0 + h} ${Y1}A${h} ${h} 0 0 0 ${x0} ${Y1 - h}`;
  else d += `L${l} ${b}`;
  return d + 'Z';
}
function sectionPath(cells, h, rad){
  const set = new Set(cells), has = (c, r) => c >= 0 && c < COLS && r >= 0 && set.has(r * COLS + c);
  let d = '';
  for (const i of cells) {
    const c = i % COLS, r = i / COLS | 0;
    d += cellD(c * U, r * U, h, rad, {L:has(c - 1, r), R:has(c + 1, r), T:has(c, r - 1), B:has(c, r + 1),
      TL:has(c - 1, r - 1), TR:has(c + 1, r - 1), BR:has(c + 1, r + 1), BL:has(c - 1, r + 1)});
  }
  return d;
}
// Height of the water surface so that the coloured AREA (not height) matches the time left.
function waterY(cells, frac){
  const rows = {}; cells.forEach(i => { const r = i / COLS | 0; rows[r] = (rows[r] || 0) + 1; });
  const rs = Object.keys(rows).map(Number).sort((a, b) => b - a);
  let A = frac * cells.length;
  for (const r of rs) { const c = rows[r]; if (A >= c - 1e-9) { A -= c; continue; } return (r + 1) * U - (A / c) * U; }
  return rs.length ? Math.min(...rs) * U : 0;
}
function waterD(x0, x1, y, yb, amp, ph){
  if (amp < .3) return `M${x0} ${y.toFixed(1)}H${x1}V${yb}H${x0}Z`;
  let d = `M${x0} ${yb}`;
  for (let x = x0; x <= x1 + 1e-6; x += 8) d += `L${x.toFixed(0)} ${(y + Math.sin(x / 150 * Math.PI * 2 + ph) * amp).toFixed(1)}`;
  return d + `L${x1} ${yb}Z`;
}
function labelSpot(cells){
  const rows = {}; cells.forEach(i => { (rows[i / COLS | 0] = rows[i / COLS | 0] || []).push(i % COLS); });
  let best = null;
  for (const r of Object.keys(rows).map(Number).sort((a, b) => a - b)) {
    const cs = rows[r].sort((a, b) => a - b); let start = cs[0], prev = cs[0];
    for (let k = 1; k <= cs.length; k++) {
      if (k < cs.length && cs[k] === prev + 1) { prev = cs[k]; continue; }
      const len = prev - start + 1; if (!best || len > best.len) best = {r, c0:start, len};
      if (k < cs.length) { start = prev = cs[k]; }
    }
  }
  return best;
}
const fmtLeft = sec => fmtMin(Math.ceil(remaining(sec) / 60000));
// wy = water surface: text below it sits on full colour, text above it on the pale drained part.
function labelSvg(sec, cells, mode, sc, wy = -1){
  const sp = labelSpot(cells); if (!sp) return '';
  const fs = Math.min(U * .25, 13 / sc), maxW = sp.len * U - U * .18;
  const name = sec.name || '…', maxCh = Math.max(1, Math.floor(maxW / (fs * .6)));
  const txt = name.length > maxCh ? name.slice(0, Math.max(1, maxCh - 1)) + '…' : name;
  const sub = mode === 'plan' ? fmtMin(cells.length * CELL_MIN) : (sec.done ? '✓' : remaining(sec) <= 0 ? '0m' : fmtLeft(sec));
  const cx = (sp.c0 + sp.len / 2) * U, cy = (sp.r + .5) * U;
  const line = (y, size, cls, s) => `<text class="lbl${cls}" ${y >= wy ? `fill="${onColor(sec.color)}"` : 'style="fill:var(--text)"'} x="${cx}" y="${y.toFixed(1)}" font-size="${size.toFixed(1)}">${esc(s)}</text>`;
  if (fs * 2.4 > U * .92) return line(cy, fs, '', txt);

function sizeSvg(wrap, svg, rows, maxCell = 120){
  const w = wrap.clientWidth, h = wrap.clientHeight; if (!w || !h) return 0;

}
// mode: 'preview' (home), 'plan' (painting), 'board' (water levels)
function drawGrid(svg, plan, mode, opt = {}){
  const n = cellCount(plan), rows = Math.max(1, Math.ceil(n / COLS)), h = U * .035, rad = U * .16;

    body += `<rect class="cell" x="${c * U + h}" y="${r * U + h}" width="${U - 2 * h}" height="${U - 2 * h}" rx="${rad}"/>`;
  }
  for (const sec of plan.sections) {
    const cells = sec.cells.filter(i => i < n); if (!cells.length) continue;
    const d = sectionPath(cells, h, rad);
    let wy = -1;
    if (mode === 'board') {
      const tot = total(sec), frac = sec.done ? 0 : (tot ? remaining(sec) / tot : 0);
      const id = svg.id + sec.id;
      wy = frac > 0 ? waterY(cells, frac) : rows * U + 1;
      defs += `<clipPath id="${id}"><path d="${d}"/></clipPath>`;
      body += `<path class="tint" d="${d}" fill="${sec.color}"/>`;
      if (frac > 0) body += `<rect clip-path="url(#${id})" x="0" y="${wy.toFixed(1)}" width="${COLS * U}" height="${(rows * U - wy + 1).toFixed(1)}" fill="${sec.color}"/>`;
    } else {

    }

/* ---------------- screens ---------------- */
let view = null;

  view = id;

  if (id === 'board') { renderBoard(); if (updateReady && !runningSection()) location.reload(); }

/* ----- home ----- */
let homeMin = S.settings.lastMinutes;
function renderHome(){
  $('homeDate').textContent = fmtDate(new Date());
  $('hVal').textContent = fmtMin(homeMin);
  $('hQuick').innerHTML = [60, 120, 180, 240].map(m => `<button class="qchip${m === homeMin ? ' on' : ''}" data-m="${m}">${fmtMin(m)}</button>`).join('');
  $('hGo').textContent = t(S.plan ? 'updateGrid' : 'makeGrid');

function setHome(m){ const v = Math.min(720, Math.max(15, m)); if (v !== homeMin) { homeMin = v; SFX.tick(homeMin / 15); } renderHome(); }

  btn.addEventListener('pointerdown', () => { fn(); t1 = setTimeout(() => t2 = setInterval(fn, 90), 420); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}
holdRepeat($('hMinus'), () => setHome(homeMin - 15));
holdRepeat($('hPlus'), () => setHome(homeMin + 15));
$('hQuick').onclick = e => { const b = e.target.closest('[data-m]'); if (b) setHome(+b.dataset.m); };
$('hGo').onclick = () => {

  if (!S.plan) S.plan = {date:dayKey(), minutes:homeMin, sections:[], confirmed:false};
  else { S.plan.minutes = homeMin; const n = cellCount(S.plan); S.plan.sections.forEach(s => s.cells = s.cells.filter(i => i < n)); }
  save(); SFX.confirm(); show('plan');
};

/* ----- planner ----- */
let activeId = null, tool = 'paint', drag = null;
function renderPlan(){
  const plan = P(); if (!plan) return;
  if (activeId && !secById(activeId)) activeId = null;
  drawGrid($('pSvg'), plan, 'plan', {wrap:$('pWrap'), activeId:tool === 'paint' ? activeId : null});
  const n = cellCount(plan), planned = plan.sections.reduce((a, s) => a + s.cells.filter(i => i < n).length, 0);
  $('pStats').innerHTML =
    `<button class="pill" id="pHours">${ic('clock')}<b>${fmtMin(plan.minutes)}</b> ${t('available')}</button>` +
    `<span class="pill"><b>${fmtMin(planned * CELL_MIN)}</b> ${t('planned')}</span>` +
    `<span class="pill"><b>${fmtMin((n - planned) * CELL_MIN)}</b> ${t('free')}</span>`;
  const act = secById(activeId);
  $('pHint').textContent = tool === 'erase' ? t('hintErase') : act ? t('hintActive', {name:act.name || '…'}) : t('hintFirst');
  $('pTools').innerHTML =
    `<button class="chip add" data-tool="new"${plan.sections.length >= PALETTE.length ? ' disabled' : ''}>${ic('plus')}${t('newTopic')}</button>` +
    plan.sections.map(s => `<button class="chip${tool === 'paint' && s.id === activeId ? ' on' : ''}" data-sec="${s.id}" style="--c:${s.color}"><span class="dot"></span><span class="nm">${esc(s.name || '…')}</span><small>${fmtMin(s.cells.length * CELL_MIN)}</small></button>`).join('') +
    `<button class="chip${tool === 'erase' ? ' on' : ''}" data-tool="erase">${ic('erase')}${t('erase')}</button>`;
  $('pConfirm').disabled = !plan.sections.some(s => s.cells.length);
}
function cellAt(svg, e, n){
  const r = svg.getBoundingClientRect(), rows = Math.ceil(n / COLS);
  const x = (e.clientX - r.left) / r.width * COLS, y = (e.clientY - r.top) / r.height * rows;
  if (x < 0 || y < 0 || x >= COLS || y >= rows) return -1;

}

  else if (drag.mode === 'erase' && sec && own === sec.id) { sec.cells = sec.cells.filter(x => x !== i); SFX.erase(); }

}

$('pWrap').addEventListener('pointerup', endDrag);
$('pWrap').addEventListener('pointercancel', endDrag);
$('pTools').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tool === 'new') { tool = 'paint'; openName(null, false); return; }

};
$('pStats').onclick = e => { if (e.target.closest('#pHours')) { homeMin = P().minutes; show('home'); } };
function leavePlan(){
  const plan = P(); plan.sections = plan.sections.filter(s => s.cells.length);
  activeId = null; tool = 'paint'; save();
}
$('pBack').onclick = () => {
  if (P().confirmed) { leavePlan(); show('board'); }
  else { homeMin = P().minutes; show('home'); }
};
$('pConfirm').onclick = () => {

};

/* ----- name sheet ----- */

/* ----- board ----- */
function renderBoard(){
  const plan = P(); if (!plan) return;
  $('bDate').textContent = fmtDay(dayKey());
  $('bEdit').hidden = S.settings.lock;
  syncSwitches();
  const secs = sortedSections();
  $('bList').innerHTML = secs.map(s => `<li><button class="item${s.done ? ' done' : ''}${s.runSince ? ' run' : ''}" data-id="${s.id}" style="--c:${s.color}">
      <span class="sw" style="--f:${frac(s).toFixed(3)}"></span><span class="iname">${esc(s.name)}</span>
      <span class="imeta">${metaText(s)}</span><span class="go">${ic(s.done ? 'check' : s.runSince ? 'pause' : 'play')}</span></button></li>`).join('');
  boardLive();
}
function boardLive(){
  const plan = P(); if (!plan) return;
  drawGrid($('bSvg'), plan, 'board', {wrap:$('bWrap')});
  let used = 0, tot = 0;
  plan.sections.forEach(s => { tot += total(s); used += s.done ? total(s) : total(s) - remaining(s); });
  $('bProgress').textContent = t('progress', {a:fmtMin(used / 60000), b:fmtMin(tot / 60000)});
  const run = runningSection(), b = plan.brk, bn = b && secById(b.nextId), now = Date.now();
  const left = plan.sections.filter(s => !s.done && remaining(s) > 0);
  $('bLead').textContent = !left.length && plan.sections.length ? t('allDone') : run ? t('working', {name:run.name})
    : bn ? t('breakLead', {name:bn.name, t:fmtClock(Math.max(0, b.until - now))}) : t('pickSection');
  // When will everything be finished? Time left in every open section (+ 1-minute breaks with autorun).

  tick(i){ if (this.ok()) this.tone(mtof([72, 74, 76, 79, 81][Math.abs(i | 0) % 5]), this.now(), {g:.03, d:.07}); },
  erase(){ if (this.ok()) this.tone(392, this.now(), {g:.03, d:.08, glide:.7}); },
  select(){ if (this.ok()) this.tone(988, this.now(), {g:.018, d:.05}); },
  pop(){ if (this.ok()) { const t = this.now(); this.bell(784, t, .04, 1); this.bell(1175, t + .07, .035, 1.2); } },
  confirm(){ if (this.ok()) { const t = this.now(); this.bell(659.25, t, .045, 1.2); this.bell(987.77, t + .11, .045, 1.6); } },
  start(){ if (this.ok()) { const t = this.now(); [523.25, 659.25, 783.99].forEach((f, k) => this.bell(f, t + k * .09, .04, 1.4)); } },
  pause(){ if (this.ok()) { const t = this.now(); this.bell(783.99, t, .035, 1); this.bell(587.33, t + .1, .035, 1.2); } },
  done(){ if (this.ok()) { const t = this.now(); [659.25, 783.99, 1046.5].forEach((f, k) => this.bell(f, t + k * .12, .045, 1.8)); } },
  // Autorun: the next section starts by itself. A brighter rising figure over a low note, unlike the start sound.
  autoNext(){ if (this.ok(true)) { const t = this.now(); this.bell(293.66, t, .05, 2.4); [587.33, 880, 1174.66, 1760].forEach((f, k) => this.bell(f, t + k * .13, .06, 2)); } },
  warnAt(t, force){
    if (!A.ctx || !(force || S.settings.chimes)) return [];
    return [[880, 0], [1318.5, .3], [880, 1.4], [1318.5, 1.7]].flatMap(([f, dt]) => this.bell(f, t + dt, .085, 2.4));
  },
  endAt(t){
    if (!A.ctx || !S.settings.chimes) return [];
    return [523.25, 659.25, 783.99, 1046.5, 1318.5].flatMap((f, k) => this.bell(f, t + k * .16, .075, 3.2));
  }
};
// The warning and end chimes are booked on the audio clock in advance, so they still ring
// if the phone is briefly busy with another app. The 250 ms tick is the fallback.
const Alerts = {
  warn:null, end:null,
  stop(k){ const a = this[k]; if (a) a.nodes.forEach(o => { try { o.stop(0); } catch (e) {} try { o.disconnect(); } catch (e) {} }); this[k] = null; },
  cancel(){ this.stop('warn'); this.stop('end'); },
  forget(){ this.warn = this.end = null; },
  played(k){ const a = this[k]; return !!a && !!A.ctx && A.ctx.state === 'running' && A.ctx.currentTime >= a.at - .3; },
  schedule(sec){
    this.cancel(); if (!A.ctx || !sec.runSince || !S.settings.chimes) return;
    const rem = remaining(sec) / 1000, now = A.ctx.currentTime, w = warnMs() / 1000;
    if (!sec.warned && rem > w) this.warn = {at:now + rem - w, nodes:SFX.warnAt(now + rem - w)};
    this.end = {at:now + rem, nodes:SFX.endAt(now + rem)};
  }
};

/* ----- generated background tracks ----- */
function pluck(ctx, out, f, t, g, d){
  [[1, 1], [2, .22], [3, .07]].forEach(([m, k]) => {
    const o = ctx.createOscillator(), v = ctx.createGain(); o.frequency.value = f * m;
    v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(g * k, t + .008); v.gain.exponentialRampToValueAtTime(.0001, t + d / m);
    o.connect(v).connect(out); o.start(t); o.stop(t + d / m + .1);
  });
}
function noiseHit(ctx, out, t, type, freq, q, g, d){
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), v = ctx.createGain();
  s.buffer = A.white; f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(v).connect(out); s.start(t, Math.random() * 1.5); s.stop(t + d + .05);
}
function loopNoise(ctx, buf){ const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s; }
const TRACKS = [
  {key:'trDrift', make(ctx, out){
    const prog = [[50, 57, 62, 66, 69, 76], [47, 54, 59, 62, 66, 73], [43, 50, 55, 59, 62, 69], [45, 52, 57, 61, 64, 71]];
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1000; lp.Q.value = .3; lp.connect(out);
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .045; lg.gain.value = 380; lfo.connect(lg).connect(lp.frequency); lfo.start();
    let k = 0;
    return {schedule(t){
      const ch = prog[k++ % prog.length], dur = 9;
      ch.forEach((m, j) => [-7, 7].forEach(dt => {
        const o = ctx.createOscillator(), g = ctx.createGain(), pk = j === 0 ? .08 : .028;
        o.type = j === 0 ? 'sine' : 'triangle'; o.frequency.value = mtof(m); o.detune.value = dt;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + 3); g.gain.setValueAtTime(pk, t + dur - .5); g.gain.linearRampToValueAtTime(0, t + dur + 3);
        o.connect(g).connect(lp); o.start(t); o.stop(t + dur + 3.1);
      }));
      for (let s = 0; s < 2; s++) if (Math.random() < .6) pluck(ctx, out, mtof(ch[2 + (Math.random() * (ch.length - 2) | 0)] + 12), t + 1 + Math.random() * (dur - 2), .025, 4);
      return t + dur;
    }, stop(){ try { lfo.stop(); } catch (e) {} }};
  }},
  {key:'trRain', make(ctx, out){
    const n = loopNoise(ctx, A.white), hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 900; lp.type = 'lowpass'; lp.frequency.value = 5000; g.gain.value = .045;
    n.connect(hp).connect(lp).connect(g).connect(out); n.start();
    const scale = [57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81]; let p = 5;
    return {schedule(t){
      p = Math.min(scale.length - 1, Math.max(0, p + (Math.random() * 7 | 0) - 3));
      pluck(ctx, out, mtof(scale[p]), t, .06, 3.2);
      if (Math.random() < .25) pluck(ctx, out, mtof(scale[Math.max(0, p - 2)]), t + .03, .035, 3);
      if (Math.random() < .5) { const tt = t + Math.random() * .8, o = ctx.createOscillator(), v = ctx.createGain();
        o.frequency.setValueAtTime(2600 + Math.random() * 900, tt); o.frequency.exponentialRampToValueAtTime(900, tt + .05);
        v.gain.setValueAtTime(.012, tt); v.gain.exponentialRampToValueAtTime(.0001, tt + .07); o.connect(v).connect(out); o.start(tt); o.stop(tt + .1); }
      return t + .7 + Math.random() * 1.9;
    }, stop(){ try { n.stop(); } catch (e) {} }};
  }},
  {key:'trLofi', make(ctx, out){
    const beat = 60 / 72, bar = beat * 4;
    const chords = [[41, 57, 60, 64, 67], [40, 55, 59, 62, 66], [38, 53, 57, 60, 64], [36, 52, 55, 59, 62]];
    const cb = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate), cd = cb.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = Math.random() < .0006 ? (Math.random() * 2 - 1) * .8 : (Math.random() * 2 - 1) * .006;
    const cr = loopNoise(ctx, cb), cf = ctx.createBiquadFilter(), cg = ctx.createGain();
    cf.type = 'lowpass'; cf.frequency.value = 3200; cg.gain.value = .35; cr.connect(cf).connect(cg).connect(out); cr.start();
    const keys = ctx.createBiquadFilter(); keys.type = 'lowpass'; keys.frequency.value = 1700; keys.connect(out);
    let k = 0;
    const kick = t => { const o = ctx.createOscillator(), v = ctx.createGain(); o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(46, t + .13);
      v.gain.setValueAtTime(.32, t); v.gain.exponentialRampToValueAtTime(.0001, t + .42); o.connect(v).connect(out); o.start(t); o.stop(t + .45); };
    return {schedule(t){
      const ch = chords[k++ % 4];
      ch.slice(1).forEach((m, j) => { const tt = t + j * .015;
        [[1, .03], [2, .006]].forEach(([mm, gg]) => { const o = ctx.createOscillator(), v = ctx.createGain(); o.frequency.value = mtof(m) * mm; o.detune.value = (Math.random() - .5) * 8;
          v.gain.setValueAtTime(.0001, tt); v.gain.exponentialRampToValueAtTime(gg, tt + .02); v.gain.exponentialRampToValueAtTime(.0001, tt + bar * .98);
          o.connect(v).connect(keys); o.start(tt); o.stop(tt + bar); }); });
      [[0, 1.6], [2.5, 1.2]].forEach(([b, d]) => { const tt = t + b * beat, o = ctx.createOscillator(), v = ctx.createGain(); o.frequency.value = mtof(ch[0]);
        v.gain.setValueAtTime(.0001, tt); v.gain.exponentialRampToValueAtTime(.09, tt + .03); v.gain.exponentialRampToValueAtTime(.0001, tt + d * beat);
        o.connect(v).connect(out); o.start(tt); o.stop(tt + d * beat + .05); });
      kick(t); kick(t + 2.5 * beat); if (Math.random() < .4) kick(t + 1.75 * beat);
      [1, 3].forEach(b => noiseHit(ctx, out, t + b * beat, 'bandpass', 1800, .7, .06, .17));
      for (let e = 0; e < 8; e++) noiseHit(ctx, out, t + e * beat / 2 + (e % 2 ? beat * .09 : 0), 'highpass', 7500, .5, e % 2 ? .014 : .02, .045);
      return t + bar;
    }, stop(){ try { cr.stop(); } catch (e) {} }};
  }},
  {key:'trBrown', make(ctx, out){
    const n = loopNoise(ctx, A.brown), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 650; g.gain.value = .5;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .07; lg.gain.value = 220; lfo.connect(lg).connect(lp.frequency);
    n.connect(lp).connect(g).connect(out); n.start(); lfo.start();
    return {schedule(t){ return t + 30; }, stop(){ try { n.stop(); lfo.stop(); } catch (e) {} }};
  }}
];

/* ----- music player: generated tracks + own MP3s, or silence while another app plays ----- */
const mp3 = new Audio(); mp3.preload = 'auto';
let mp3Node = null, mp3Url = null, mp3Id = null;
mp3.addEventListener('ended', () => { if (Music.on) Music.next(); });
const Music = {
  on:false, gen:null, _h:0,
  src(){ return S.settings.musicSource; },
  list(){ return [...TRACKS.map((x, i) => ({kind:'gen', i, name:t(x.key)})), ...S.files.map(f => ({kind:'file', id:f.id, name:f.name}))]; },
  idx(){ const n = this.list().length; return ((S.settings.track % n) + n) % n; },
  cur(){ return this.list()[this.idx()]; },
  want(){ return !!runningSection() && !S.settings.muted; },
  sync(){ const w = this.want(); if (w && !this.on) this.start(); else if (!w && this.on) this.stop(); updateMusicUI(); },
  start(){
    this.on = true; clearTimeout(this._h);
    if (this.src() !== 'app' || !audioInit()) return;
    const it = this.cur();
    if (it.kind === 'gen' && this.gen && this.gen.i === it.i) {}
    else if (it.kind === 'file' && mp3Id === it.id) mp3.play().catch(() => {});
    else this.playItem(it);
    this.fade(1, 1.5);
  },
  stop(){
    this.on = false;
    if (!A.ctx) return;
    this.fade(0, .9); clearTimeout(this._h);
    this._h = setTimeout(() => { if (!this.on) { this.haltGen(); mp3.pause(); } }, 1000);
  },
  fade(to, dur){
    if (!A.ctx) return; const now = A.ctx.currentTime, v = S.settings.musicVol;
    [[A.genOut, .55 * v], [A.fileOut, .9 * v]].forEach(([g, lvl]) => { g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(to * lvl, now + dur); });
  },
  haltGen(){
    if (!this.gen) return; const G = this.gen; this.gen = null;
    G.g.gain.setTargetAtTime(0, A.ctx.currentTime, .15);
    setTimeout(() => { try { G.gen.stop(); } catch (e) {} try { G.g.disconnect(); } catch (e) {} }, 900);
  },
  playItem(it){
    this.haltGen(); if (!it) return;
    if (it.kind === 'gen') {
      mp3.pause(); mp3Id = null;
      const g = A.ctx.createGain(); g.connect(A.genOut);
      this.gen = {i:it.i, g, gen:TRACKS[it.i].make(A.ctx, g), nextT:A.ctx.currentTime + .05};
    } else playFile(it.id);
  },
  next(){ if (this.src() === 'app') this.select(this.idx() + 1); },
  select(i){ S.settings.track = i; save(); if (this.on && this.src() === 'app' && A.ctx) this.playItem(this.cur()); updateMusicUI(); if (!$('ovMusic').hidden) renderMusic(); },
  setSource(s){
    if (s === this.src()) return;
    if (this.on) { this.fade(0, .4); this.haltGen(); mp3.pause(); }
    this.on = false; S.settings.musicSource = s; save(); this.sync();
  }
};
setInterval(() => {
  const G = Music.gen; if (!G || !A.ctx) return;
  let guard = 0; while (G.nextT < A.ctx.currentTime + 1.5 && guard++ < 8) G.nextT = G.gen.schedule(Math.max(G.nextT, A.ctx.currentTime + .05));
}, 200);
async function playFile(id){
  try {
    const rec = await idb('readonly', st => st.get(id)); if (!rec) { Music.select(0); return; }
    if (mp3Url) URL.revokeObjectURL(mp3Url);
    mp3Url = URL.createObjectURL(rec.blob); mp3Id = id; mp3.src = mp3Url;
    if (!mp3Node && A.ctx) { mp3Node = A.ctx.createMediaElementSource(mp3); mp3Node.connect(A.fileOut); }
    if (Music.on) await mp3.play();
  } catch (e) {}
}
function updateMusicUI(){
  const src = Music.src(), m = S.settings.muted;
  $('tMute').innerHTML = ic(m ? 'mute' : 'vol'); $('tMute').setAttribute('aria-label', t(m ? 'unmute' : 'mute')); $('tMute').classList.toggle('on', m);
  $('tNext').disabled = src === 'other';
  let label = src === 'app' ? Music.cur().name : t('srcOther');
  if (Music.on && src === 'app' && A.ctx && A.ctx.state !== 'running') label = t('tapForSound');
  $('tTrack').innerHTML = ic(src === 'app' ? 'music' : 'wave') + `<span>${esc(label)}</span>`;
}

/* ----- own MP3s (stored in this phone's browser storage) ----- */
let dbP = null;
function idb(mode, op){
  dbP = dbP || new Promise((res, rej) => { const r = indexedDB.open('carvetime', 1); r.onupgradeneeded = () => r.result.createObjectStore('music', {keyPath:'id'}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return dbP.then(db => new Promise((res, rej) => { const tx = db.transaction('music', mode), req = op(tx.objectStore('music')); tx.oncomplete = () => res(req && req.result); tx.onerror = tx.onabort = () => rej(tx.error); }));
}
$('mAdd').onclick = () => $('fMp3').click();
$('fMp3').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; let ok = 0;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  for (const f of files) {
    const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name = f.name.replace(/\.[^.]+$/, '');
    try { await idb('readwrite', st => st.put({id, name, blob:f})); S.files.push({id, name}); ok++; } catch (err) { toast(t('fileFail')); }
  }
  save(); renderMusic(); if (ok) toast(t('filesAdded', {n:ok}));
};
async function removeFile(id){
  const f = S.files.find(x => x.id === id); if (!f || !confirm(t('removeQ', {name:f.name}))) return;
  const wasCur = Music.cur().id === id, idx = Music.idx();
  S.files = S.files.filter(x => x.id !== id); try { await idb('readwrite', st => st.delete(id)); } catch (e) {}
  if (wasCur) { mp3.pause(); mp3Id = null; Music.select(Math.min(idx, Music.list().length - 1)); } else { S.settings.track = Math.min(S.settings.track, Music.list().length - 1); save(); }
  renderMusic();
}

/* ----- music sheet ----- */
function openMusic(){ renderMusic(); openOv('ovMusic'); }
function renderMusic(){
  const src = Music.src();
  document.querySelectorAll('#mSrc button').forEach(b => b.classList.toggle('on', b.dataset.v === src));
  $('mApp').hidden = src !== 'app'; $('mOther').hidden = src !== 'other';
  const ci = Music.idx();
  $('mTracks').innerHTML = Music.list().map((it, i) => `<li class="trk${i === ci ? ' on' : ''}"><button class="tsel" data-i="${i}">${ic(it.kind === 'gen' ? 'music' : 'file')}<span>${esc(it.name)}</span></button>${it.kind === 'file' ? `<button class="icon sm" data-rm="${it.id}" aria-label="${t('delete')}">${ic('trash')}</button>` : ''}</li>`).join('');
  $('mVol').value = S.settings.musicVol;
}
$('mSrc').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { SFX.select(); Music.setSource(b.dataset.v); renderMusic(); renderSettings(); } };
$('mTracks').onclick = e => {
  const rm = e.target.closest('[data-rm]'); if (rm) { removeFile(rm.dataset.rm); return; }
  const b = e.target.closest('[data-i]'); if (b) { audioInit(); SFX.select(); Music.select(+b.dataset.i); }
};
$('mVol').oninput = e => { S.settings.musicVol = +e.target.value; save(); if (Music.on) Music.fade(1, .15); };

/* ----- open another music app (Android intent with a web fallback) ----- */
const APPS = {
  spotify:{pkg:'com.spotify.music', url:'https://open.spotify.com/'},
  storytel:{pkg:'grit.storytel.app', url:'https://www.storytel.com/'},
  ytm:{pkg:'com.google.android.apps.youtube.music', url:'https://music.youtube.com/'}
};
function openApp(k){
  const a = APPS[k]; if (!a) return; const u = new URL(a.url);
  if (/Android/i.test(navigator.userAgent)) location.href = `intent://${u.host}${u.pathname}#Intent;scheme=https;package=${a.pkg};S.browser_fallback_url=${encodeURIComponent(a.url)};end`;
  else window.open(a.url, '_blank', 'noopener');
}

/* ---------------- screen wake lock ---------------- */
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && S.settings.wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

/* ---------------- start-up ---------------- */
function route(){
  const r = runningSection(), b = S.plan && S.plan.brk;
  if (S.plan && S.plan.date !== dayKey() && !r && !b) { S.plan = null; save(); }
  if (!S.plan) show('home');
  else if (!S.plan.confirmed) show('plan');
  else if (r) openTimer(r.id);
  else if (b && secById(b.nextId)) openTimer(b.nextId);
  else show('board');
}
document.addEventListener('pointerdown', () => {
  armBack();
  const wasOff = !A.ctx || A.ctx.state !== 'running';
  audioInit();
  if (wasOff && A.ctx) setTimeout(() => {
    const r = runningSection(); if (r) Alerts.schedule(r);
    if (Music.on && Music.src() === 'app' && Music.cur().kind === 'file' && mp3.paused) mp3.play().catch(() => {});
    updateMusicUI();
  }, 120);
}, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const r = runningSection();
  if (r) { keepAwake(true); if (A.ctx) Alerts.schedule(r); }
  else if (S.plan && S.plan.brk) keepAwake(true);
  tick();
  if (!r && !(S.plan && S.plan.brk) && S.plan && S.plan.date !== dayKey() && (view === 'board' || view === 'home')) { S.plan = null; save(); show('home'); }
});
let resizeT;
new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === 'home') renderHome(); if (view === 'plan' && !drag) renderPlan(); if (view === 'board') boardLive(); }, 60); }).observe(document.querySelector('.app'));

document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = ic(el.dataset.ic));
$('logo').innerHTML = LOGO; $('logo2').innerHTML = LOGO;
if (S.plan) S.plan.sections.forEach(s => { if (!s.name) s.name = t('untitled'); });
// Spotify remote control was removed in 1.2.0: fall back to the built-in music and drop its saved data.
if (S.settings.musicSource === 'spotify') S.settings.musicSource = 'app';
delete S.settings.spotifyId; localStorage.removeItem('carvetime.sp'); localStorage.removeItem('carvetime.sp.pkce');
save();
pruneTopics();
applyI18n();
route();
if (runningSection()) { keepAwake(true); Music.sync(); }

// Updates: Android often resumes the app instead of reopening it, so look for a new version
// every time the app comes back on screen, and switch to it without interrupting a running timer.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let hadWorker = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadWorker) { hadWorker = true; return; }
    if (runningSection() || view !== 'board') updateReady = true; else location.reload();
  });
}
